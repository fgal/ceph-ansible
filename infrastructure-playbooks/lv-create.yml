- name: creates logical volumes for the bucket index or fs journals on a single device.
  become: true
  hosts: osds

  vars:
    logfile: |
      # Suggested cut and paste under "lvm_volumes:" in "group_vars/osds.yml"
      # ---------------------------------------------------------------------
      lvm_volumes:
      {% for ssd in ssd_devices %}
        - data: {{ ssd_lv_prefix }}-{{ ssd.split('/')[-1] }}
          data_vg: {{ ssd_vg_prefix }}-{{ ssd.split('/')[-1] }}
      {% endfor %}
      {% for hdd in hdd_devices %}
        - data: {{ hdd_lv_prefix }}-{{ hdd.split('/')[-1] }}
          data_vg: {{ hdd_vg_prefix }}-{{ hdd.split('/')[-1] }}
          db: {{ rocks_lvs[ loop.index - 1 ].split('-=-')[-1] }}
          db_vg: {{ rocks_lvs[ loop.index - 1 ].split('-=-')[-2] }}
      {% endfor %}

  tasks:

  - name: check existence of vars file lv_vars.yaml_{{ ansible_facts.hostname }}.{{ ansible_facts.domain }}
    stat:
      path: "{{ playbook_dir }}/vars/lv_vars.yaml_{{ ansible_facts.hostname }}.{{ ansible_facts.domain }}"
    register: stat_vars_hostname
    delegate_to: localhost
  - name: include vars of lv_vars.yaml_{{ ansible_facts.hostname }}.{{ ansible_facts.domain }}
    include_vars:
      file: lv_vars.yaml_"{{ ansible_facts.hostname }}.{{ ansible_facts.domain }}"
    failed_when: false
    when: stat_vars_hostname.stat.exists
  - name: include vars of lv_vars.yaml
    include_vars:
      file: lv_vars.yaml
    failed_when: false
    when: not stat_vars_hostname.stat.exists

#   # ensure nvme_device is set
#   - name: fail if nvme_device is not defined
#     fail:
#       msg: "nvme_device has not been set by the user"
#     when: nvme_device is undefined or nvme_device == 'dummy'

  - name: create new ROCKS list
    set_fact:
      rocks_lvs: "{{ rocks_lvs | default([]) + [ '-'.join(( 
            rocksdb_hdd_devices[item|int % rocksdb_hdd_devices|length], '=',
            rocks_vg_prefix , 
            rocksdb_hdd_devices[item|int % rocksdb_hdd_devices|length].split('/')[-1] ,
            '=' , rocks_lv_prefix , 
            hdd_devices[item|int].split('/')[-1], 'vg',
            rocksdb_hdd_devices[item|int % rocksdb_hdd_devices|length].split('/')[-1] )) ] }}"
    with_sequence: start=0 end={{ hdd_devices|length - 1}}

  - debug: var=rocks_lvs

  # need to check if lvm2 is installed
  - name: install lvm2
    package:
      name: lvm2
      state: present
    register: result
    until: result is succeeded

